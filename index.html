<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1E1E">
<title>VENDAS PLUS+</title>
<style>
:root{--bg:#121212;--bar:#1E1E1E;--line:#2D2D2D;--tx:#E0E0E0;--mu:#9ca3af;--or:#f97316;--or2:#ea580c;--gr:#15803d;--wa:#16a34a;--in:#3a3a3a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:12px 14px 16px}
.bar{background:var(--bar);border-bottom:1px solid var(--line);padding:10px 14px;position:sticky;top:0;z-index:5}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:700;color:var(--or);font-size:17px}
.chip{background:#2D2D2D;color:#fb923c;border:1px solid var(--or2);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.menu{margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.menu div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between}
.on{color:#fb923c}
.in{width:100%;height:44px;background:var(--bar);border:1px solid var(--in);border-radius:10px;padding:0 12px;outline:none}
.in:focus,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--or);outline-offset:1px}
textarea.in{height:76px;padding:10px 12px;resize:none}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 4px}
.f{margin-bottom:12px}.er{color:#f87171;font-size:12px;margin-top:3px}
.btn{width:100%;height:46px;border:0;border-radius:12px;background:var(--or2);color:#fff;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.6;cursor:wait}.btn.wa{background:var(--wa)}.btn.ghost{background:transparent;border:1px solid var(--or2);color:#fb923c}
.cats{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.cat{white-space:nowrap;background:#2D2D2D;color:#d1d5db;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.cat.on{background:var(--or2);color:#fff}
.ban{border-radius:14px;padding:16px;height:180px;display:flex;flex-direction:column;justify-content:center;border:1px solid}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 12px}
.dots i{height:6px;width:6px;border-radius:9px;background:#4b5563;cursor:pointer}.dots i.a{width:16px;background:var(--or)}
h2{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;color:#111827;border:0;text-align:left;padding:0}
.th{height:84px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.cb{padding:8px 10px 10px}.cn{font-weight:600;font-size:14px}.cp{color:var(--gr);font-weight:700;font-size:17px}.cs{color:#6b7280;font-size:11px;margin-top:3px}
.nav{position:sticky;bottom:0;background:var(--bar);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0}
.nav button.on{color:var(--or)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bar);border-radius:10px;padding:3px;margin:14px 0}
.tabs button{border:0;background:none;padding:9px;border-radius:8px;color:var(--mu);cursor:pointer}.tabs button.on{background:var(--or2);color:#fff}
.sheet{background:#fff;color:#111827;border-radius:16px 16px 0 0;margin-top:-14px;padding:16px;position:relative;flex:1}
.pill{display:inline-block;background:#f3f4f6;color:#374151;border-radius:999px;padding:3px 10px;font-size:12px;margin:0 6px 6px 0}
.sel{border:1px solid #e5e7eb;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--or2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.bd{font-size:11px;border-radius:999px;padding:2px 8px;background:#422006;color:#fbbf24}.bd.ok{background:#052e16;color:#4ade80}.bd.no{background:#450a0a;color:#f87171}
.ph{display:flex;gap:8px;overflow-x:auto}.ph>*{flex:0 0 64px;height:64px;border-radius:10px;overflow:hidden;background:#2a2a2a;border:1px dashed var(--or2);color:#fb923c;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;margin:0}
.ph img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111827;padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.4);max-width:90%}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
</style>
</head>
<body>
<div id="app"><main class="empty">A carregar...</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>')</script>
<script>
window.onerror=function(m){var a=document.getElementById('app');if(a)a.innerHTML='<main class="empty">Erro: '+String(m).replace(/</g,'&lt;')+'<br><br>Envia esta mensagem ao Claude.</main>'};
if(!window.supabase){document.getElementById('app').innerHTML='<main class="empty">Não foi possível carregar a biblioteca. Verifica a internet e tenta de novo.</main>'}
// ===== CONFIGURAÇÃO (chave pública do Supabase) =====
var SB_URL='https://fbwcduilnxnmowcnpmky.supabase.co';
var SB_KEY='sb_publishable_9HBjGJZX9VL5VTr0WY2jKQ_blxafql1';
// =====================================================
var sb=supabase.createClient(SB_URL,SB_KEY);
var IC={shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',store:'<path d="M3 9l2-5h14l2 5M4 9v11h16V9M9 20v-6h6v6"/>',plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',back:'<path d="M15 5l-7 7 7 7"/>',wa:'<path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/>'};
function ic(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Number(n).toLocaleString('pt-PT')}
var CATS=['Todos','Calçado','Roupa','Telemóveis','Casa'],CIDS=['Maputo','Matola','Beira','Nampula','Outra'],EM={Calçado:'👟',Roupa:'👕',Telemóveis:'📱',Casa:'🏠'};
var COL=[['#431407','#9a3412','#fb923c'],['#1e1b4b','#3730a3','#a5b4fc'],['#052e16','#166534','#4ade80']];
var S={user:null,prof:null,mode:'Comprador',scr:'auth',tab:'signup',pid:null,q:'',cat:'Todos',ad:0,open:false,photos:[],form:{},prods:[],mine:[],ban:[],pend:[],abn:[],bimg:null,bf:{},pimg:0};
var app=document.getElementById('app');
function $(id){return document.getElementById(id)}
function go(s){S.scr=s;S.open=false;render();window.scrollTo(0,0)}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}
function field(id,l,ph,type,val){return '<div class="f"><label for="'+id+'">'+l+'</label><input class="in" id="'+id+'" type="'+(type||'text')+'" placeholder="'+ph+'" value="'+esc(val||'')+'"><div class="er" id="e_'+id+'"></div></div>'}
function err(id,m){var e=$('e_'+id);if(e)e.textContent=m;return false}
function val(id){var e=$(id);return e?e.value.trim():''}
function busy(b,on,t){if(!b)return;b.disabled=on;if(t)b.textContent=t}
function map(r){var pr=r.profiles||{};return {id:r.id,nome:r.nome,preco:r.preco_mt,cat:r.categoria,cid:r.cidade,desc:r.descricao,imgs:r.imagens||[],vend:pr.nome||'Vendedor',tel:pr.telefone||'',st:r.estado}}
function card(p){var im=p.imgs[0]?'<img src="'+esc(p.imgs[0])+'" alt="" loading="lazy">':(EM[p.cat]||'🛍️');
return '<button class="card" data-a="prod" data-v="'+p.id+'"><div class="th">'+im+'</div><div class="cb"><div class="cn">'+esc(p.nome)+'</div><div class="cp">'+fmt(p.preco)+' MT</div><div class="cs">'+esc(p.vend)+' · '+esc(p.cid)+'</div></div></button>'}
function list(){var q=S.q.toLowerCase();return S.prods.filter(function(p){return (S.cat==='Todos'||p.cat===S.cat)&&(!q||(p.nome+' '+p.cat+' '+p.cid).toLowerCase().indexOf(q)>-1)})}
function grid(){var l=list();return l.length?l.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Nenhum produto encontrado.</div>'}
function banner(){if(!S.ban.length)return '';var b=S.ban[S.ad%S.ban.length],c=COL[S.ad%COL.length],p=b.products&&b.products.estado==='aprovado'?b.products:null,st='background:'+c[0]+';border-color:'+c[1],body;
if(b.imagem_url){body='<div class="ban" '+(p?'data-a="prod" data-v="'+p.id+'" ':'')+'style="padding:0;position:relative;overflow:hidden;height:140px;border-color:'+c[1]+(p?';cursor:pointer':'')+'"><img src="'+esc(b.imagem_url)+'" alt="'+esc(b.titulo||'Publicidade')+'" style="width:100%;height:100%;object-fit:cover"><span style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px">Publicidade</span>'+(b.titulo?'<div style="position:absolute;left:0;right:0;bottom:0;padding:18px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-weight:700">'+esc(b.titulo)+'</div>':'')+'</div>'}
else if(p){body='<div class="ban" data-a="prod" data-v="'+p.id+'" style="'+st+';flex-direction:row;align-items:center;gap:12px;cursor:pointer"><div class="th" style="width:84px;height:84px;border-radius:10px;flex:0 0 84px;font-size:32px">'+(p.imagens&&p.imagens[0]?'<img src="'+esc(p.imagens[0])+'" alt="">':'🛍️')+'</div><div style="min-width:0"><div style="font-size:11px;color:'+c[2]+'">Publicidade</div><div style="font-size:16px;font-weight:700;color:#fff;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.nome)+'</div><div style="color:#4ade80;font-weight:700">'+fmt(p.preco_mt)+' MT</div><div style="color:#d1d5db;font-size:12px">'+esc(p.cidade)+' · Toca para ver</div></div></div>'}
else{body='<div class="ban" style="'+st+'"><div style="font-size:11px;color:'+c[2]+'">Publicidade</div><div style="font-size:18px;font-weight:700;color:#fff;margin:3px 0">'+esc(b.titulo)+'</div><div style="color:#d1d5db;font-size:12px">'+esc(b.subtitulo)+'</div></div>'}
return body+'<div class="dots">'+S.ban.map(function(x,i){return '<i data-a="ad" data-v="'+i+'" class="'+(i===S.ad?'a':'')+'"></i>'}).join('')+'</div>'}
function head(){return '<div class="bar"><div class="logo">VENDAS PLUS+</div><div class="row" style="margin-top:6px"><span>Olá, '+esc(S.prof.nome.split(' ')[0])+'</span><button class="chip" data-a="menu">Modo: '+S.mode+' ▾</button></div>'+(S.open?'<div class="menu">'+['Comprador','Vendedor'].map(function(m){return '<div data-a="mode" data-v="'+m+'" class="'+(m===S.mode?'on':'')+'"><span>'+m+'</span>'+(m===S.mode?'<span>✓</span>':'')+'</div>'}).join('')+'</div>':'')+'</div>'}
function nav(){var it=S.mode==='Vendedor'?[['home','Início','home'],['store','Meus produtos','mine'],['plus','Criar','publish'],['user','Perfil','profile']]:[['home','Início','home'],['search','Pesquisar','search'],['user','Perfil','profile']];
if(S.prof&&S.prof.is_admin)it.push(['shield','Admin','admin']);
return '<nav class="nav">'+it.map(function(i){return '<button data-a="nav" data-v="'+i[2]+'" class="'+(S.scr===i[2]?'on':'')+'">'+ic(i[0])+i[1]+'</button>'}).join('')+'</nav>'}
function auth(){var s=S.tab==='signup';
return '<main style="padding-top:26px"><div style="text-align:center"><div class="logo" style="font-size:24px">VENDAS PLUS+</div><div style="color:var(--mu);font-size:12px;margin-top:2px">Feito em Moçambique, para moçambicanos</div></div><div class="tabs"><button class="'+(s?'on':'')+'" data-a="tab" data-v="signup">Criar conta</button><button class="'+(!s?'on':'')+'" data-a="tab" data-v="login">Entrar</button></div>'
+(s?field('nome','Nome completo','O teu nome')+field('email','Email','nome@email.com','email')+'<div class="f"><label for="tel">Telefone (WhatsApp)</label><div class="row"><div class="in" style="width:70px;display:flex;align-items:center;justify-content:center">+258</div><input class="in" id="tel" type="tel" inputmode="numeric" placeholder="84 000 0000"></div><div class="er" id="e_tel"></div></div>':field('email','Email','nome@email.com','email'))
+field('pw','Palavra-passe','Mínimo 6 caracteres','password')
+'<button class="btn" id="go" data-a="'+(s?'signup':'login')+'">'+(s?'Criar conta':'Entrar')+'</button></main>'}
function home(){return head()+'<main><input class="in" id="q" placeholder="Pesquisar produtos" value="'+esc(S.q)+'" aria-label="Pesquisar produtos"><div class="cats">'+CATS.map(function(c){return '<button class="cat '+(S.cat===c?'on':'')+'" data-a="cat" data-v="'+c+'">'+c+'</button>'}).join('')+'</div><div id="ban">'+banner()+'</div><h2>Produtos disponíveis</h2><div class="grid" id="grid">'+grid()+'</div></main>'+nav()}
function prod(){var p=S.prods.concat(S.mine).filter(function(x){return x.id===S.pid})[0];if(!p){return home()}
var im=p.imgs[0]?'<img src="'+esc(p.imgs[0])+'" alt="">':(EM[p.cat]||'🛍️');
var msg='Olá! Vi este produto na VENDAS PLUS+ e quero fazer um pedido.\n\n'+p.nome+'\nPreço: '+fmt(p.preco)+' MT\n\nLink: '+location.href;
return '<div class="bar row"><button class="chip" data-a="home">‹ Voltar</button><span class="logo">VENDAS PLUS+</span><span style="width:60px"></span></div><div class="th" style="height:220px;font-size:72px;background:#2a2a2a">'+im+'</div><div class="sheet"><div style="color:#6b7280;font-size:12px">'+esc(p.cat)+'</div><div style="font-size:19px;font-weight:700;margin:2px 0">'+esc(p.nome)+'</div><div style="font-size:26px;font-weight:700;color:var(--gr);margin-bottom:10px">'+fmt(p.preco)+' MT</div><span class="pill">'+esc(p.cid)+'</span><div style="font-weight:600;margin-top:6px">Descrição</div><p style="color:#4b5563;margin:4px 0 14px">'+esc(p.desc||'Sem descrição.')+'</p><div class="sel"><div class="av">'+esc(p.vend.slice(0,2).toUpperCase())+'</div><div><div style="font-weight:600">'+esc(p.vend)+'</div><div style="color:#6b7280;font-size:12px">'+esc(p.cid)+'</div></div></div></div><div style="background:var(--bar);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+esc(p.tel)+'?text='+encodeURIComponent(msg)+'">'+ic('wa')+'Fazer pedido</a></div>'}
function profile(){var t=S.prof.telefone||'';return head()+'<main><div class="row" style="justify-content:flex-start;gap:12px"><div class="av" style="width:48px;height:48px">'+esc(S.prof.nome.slice(0,2).toUpperCase())+'</div><div><div style="font-weight:700;font-size:16px">'+esc(S.prof.nome)+'</div><div style="color:var(--mu);font-size:12px">Conta ativa</div></div></div><div style="margin:10px 0 16px"><div class="li"><span style="color:var(--mu)">Email</span><span>'+esc(S.user.email)+'</span></div><div class="li"><span style="color:var(--mu)">Telefone</span><span>+'+esc(t.slice(0,3))+' '+esc(t.slice(3))+'</span></div><div class="li"><span style="color:var(--mu)">Verificação</span><span style="color:var(--mu)">Em breve</span></div></div><h2>Modo de uso</h2><div class="menu" style="margin:0 0 16px">'+['Comprador','Vendedor'].map(function(m){return '<div data-a="mode" data-v="'+m+'" class="'+(m===S.mode?'on':'')+'"><span>'+m+'</span><span>'+(m===S.mode?'●':'○')+'</span></div>'}).join('')+'</div><button class="btn ghost" data-a="logout">Sair</button></main>'+nav()}
function mine(){return head()+'<main><h2>Meus produtos</h2>'+(S.mine.length?S.mine.map(function(p){var b=p.st==='aprovado'?['ok','Aprovado']:p.st==='rejeitado'?['no','Rejeitado']:['','Em análise'];return '<div class="li" style="align-items:center"><div><div style="font-weight:600">'+esc(p.nome)+'</div><div style="color:var(--mu);font-size:12px">'+fmt(p.preco)+' MT · '+esc(p.cid)+'</div></div><div style="text-align:right"><span class="bd '+b[0]+'">'+b[1]+'</span><div style="margin-top:6px"><button class="chip" data-a="apagar" data-v="'+p.id+'">Apagar</button></div></div></div>'}).join(''):'<div class="empty">Ainda não publicaste nenhum produto.<br><br><button class="btn" data-a="nav" data-v="publish" style="max-width:220px;margin:auto">Publicar produto</button></div>')+'</main>'+nav()}
function publish(){var f=S.form;
return head()+'<main><h2>Publicar produto</h2><div class="f"><label>Fotos (até 4)</label><div class="ph">'+S.photos.map(function(u,i){return '<div><img src="'+u.url+'" alt="Foto '+(i+1)+'"></div>'}).join('')+(S.photos.length<4?'<label>+ Foto<input id="file" type="file" accept="image/*" hidden></label>':'')+'</div><div class="er" id="e_ph"></div></div>'
+field('pn','Nome do produto','Ex.: Sapatilhas Nike',null,f.pn)+'<div class="f"><label for="pp">Preço (MT)</label><input class="in" id="pp" inputmode="numeric" placeholder="4500" value="'+esc(f.pp)+'"><div class="er" id="e_pp"></div></div>'
+'<div class="f"><label for="pc">Categoria</label><select class="in" id="pc"><option value="">Escolher categoria</option>'+CATS.slice(1).map(function(c){return '<option'+(f.pc===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select><div class="er" id="e_pc"></div></div>'
+'<div class="f"><label for="pi">Cidade</label><select class="in" id="pi"><option value="">Escolher cidade</option>'+CIDS.map(function(c){return '<option'+(f.pi===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select><div class="er" id="e_pi"></div></div>'
+'<div class="f"><label for="pd">Descrição (opcional)</label><textarea class="in" id="pd" placeholder="Tamanhos, cor, estado, entrega...">'+esc(f.pd)+'</textarea></div><p style="color:var(--mu);font-size:12px">Os pedidos vão para o teu WhatsApp: +'+esc(S.prof.telefone)+'</p><button class="btn" id="pub" data-a="publicar">Publicar produto</button></main>'+nav()}
function saveForm(){S.form={pn:val('pn'),pp:val('pp'),pc:val('pc'),pi:val('pi'),pd:val('pd')}}
function render(){if(!S.user&&S.scr!=='auth')S.scr='auth';
app.innerHTML=S.scr==='auth'?auth():S.scr==='home'?home():S.scr==='prod'?prod():S.scr==='profile'?profile():S.scr==='mine'?mine():S.scr==='admin'?admin():publish()}
// ===== DADOS =====
function loadProds(){return sb.from('products').select('*, profiles(nome,telefone)').eq('estado','aprovado').order('criado_em',{ascending:false}).then(function(r){S.prods=(r.data||[]).map(map)})}
function loadMine(){return sb.from('products').select('*, profiles(nome,telefone)').eq('vendedor_id',S.user.id).order('criado_em',{ascending:false}).then(function(r){S.mine=(r.data||[]).map(map)})}
function loadBan(){return sb.from('banners').select('*, products(id,nome,preco_mt,imagens,cidade,estado)').eq('ativo',true).order('ordem').then(function(r){S.ban=r.data||[]})}
function loadProf(tries){return sb.from('profiles').select('*').eq('id',S.user.id).single().then(function(r){if(r.data){S.prof=r.data;S.mode=r.data.modo==='vendedor'?'Vendedor':'Comprador';return true}
if(tries>0)return new Promise(function(ok){setTimeout(ok,500)}).then(function(){return loadProf(tries-1)});return false})}
function enter(user){S.user=user;return loadProf(4).then(function(ok){if(!ok){toast('Não foi possível carregar o teu perfil.');return sb.auth.signOut()}return Promise.all([loadProds(),loadMine(),loadBan()]).then(function(){go('home')})})}
function compress(file,mx){return new Promise(function(ok,bad){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var m=mx||900,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);b?ok(b):bad()},'image/jpeg',0.8)};im.onerror=bad;im.src=u})}
function msgErr(e){var m=(e&&e.message)||'';if(/already registered/i.test(m))return 'Este email já tem conta. Usa Entrar.';if(/invalid login/i.test(m))return 'Email ou palavra-passe incorretos.';if(/rate limit/i.test(m))return 'Muitas tentativas. Espera um pouco e tenta de novo.';if(/network|fetch/i.test(m))return 'Sem ligação. Verifica a internet.';return 'Algo correu mal. Tenta de novo.'}
function loadAdmin(){return Promise.all([sb.from('products').select('*, profiles(nome,telefone)').eq('estado','em_analise').order('criado_em'),sb.from('banners').select('*, products(id,nome)').order('ordem')]).then(function(r){S.pend=(r[0].data||[]).map(map);S.abn=r[1].data||[]})}
function saveB(){S.bf={bt:val('bt'),bp:val('bp')}}
function admin(){var f=S.bf||{};
var h=head()+'<main><h2>Produtos em análise</h2>'+(S.pend.length?S.pend.map(function(p){return '<div class="li" style="align-items:center"><div style="min-width:0"><div style="font-weight:600">'+esc(p.nome)+'</div><div style="color:var(--mu);font-size:12px">'+fmt(p.preco)+' MT · '+esc(p.cid)+' · '+esc(p.vend)+'</div></div><div style="display:flex;gap:6px"><button class="chip" data-a="estado" data-v="'+p.id+'|aprovado">Aprovar</button><button class="chip" data-a="estado" data-v="'+p.id+'|rejeitado">Rejeitar</button></div></div>'}).join(''):'<div class="empty">Nenhum produto à espera.</div>');
h+='<h2 style="margin-top:18px">Banners</h2>'+(S.abn.length?S.abn.map(function(b){return '<div class="li" style="align-items:center"><div style="display:flex;gap:10px;align-items:center;min-width:0"><div class="th" style="width:56px;height:40px;flex:0 0 56px;border-radius:8px;font-size:18px">'+(b.imagem_url?'<img src="'+esc(b.imagem_url)+'" alt="">':'🛍️')+'</div><div style="min-width:0"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(b.titulo||(b.products&&b.products.nome)||'Sem título')+'</div><div style="color:var(--mu);font-size:12px">'+(b.ativo?'Ativo':'Inativo')+'</div></div></div><div style="display:flex;gap:6px"><button class="chip" data-a="bativo" data-v="'+b.id+'|'+(b.ativo?'0':'1')+'">'+(b.ativo?'Desativar':'Ativar')+'</button><button class="chip" data-a="bapagar" data-v="'+b.id+'">Apagar</button></div></div>'}).join(''):'<div class="empty">Ainda não há banners.</div>');
h+='<h2 style="margin-top:18px">Novo banner</h2><div class="f"><label>Imagem (qualquer imagem)</label><div class="ph">'+(S.bimg?'<div style="flex:0 0 120px"><img src="'+S.bimg.url+'" alt="Banner"></div>':'')+'<label style="margin:0;display:flex;align-items:center;justify-content:center;flex:0 0 64px;height:64px;cursor:pointer;text-align:center;color:#fb923c;font-size:11px">'+(S.bimg?'Trocar':'+ Imagem')+'<input id="bfile" type="file" accept="image/*" hidden></label></div></div>'
+field('bt','Texto no banner (opcional)','Ex.: Promoção de fim de mês',null,f.bt)
+'<div class="f"><label for="bp">Ligar a um produto (opcional)</label><select class="in" id="bp"><option value="">Nenhum</option>'+S.prods.map(function(p){return '<option value="'+p.id+'"'+(f.bp===p.id?' selected':'')+'>'+esc(p.nome)+'</option>'}).join('')+'</select><div class="er" id="e_bp"></div></div><button class="btn" id="addban" data-a="addban">Adicionar banner</button></main>'+nav();
return h}
// ===== AÇÕES =====
function act(a,v,el){
if(a==='tab'){S.tab=v;render()}
else if(a==='signup'){var ok=true,tel=val('tel').replace(/\s/g,'');
if(!val('nome'))ok=err('nome','Escreve o teu nome.');
if(!/^\S+@\S+\.\S+$/.test(val('email')))ok=err('email','Escreve um email válido.');
if(!/^\d{9}$/.test(tel))ok=err('tel','O telefone deve ter 9 dígitos.');
if(val('pw').length<6)ok=err('pw','A palavra-passe precisa de 6 caracteres ou mais.');
if(ok){busy(el,true,'A criar...');sb.auth.signUp({email:val('email'),password:val('pw'),options:{data:{nome:val('nome'),telefone:'258'+tel}}}).then(function(r){
if(r.error){busy(el,false,'Criar conta');err('email',msgErr(r.error));return}
if(!r.data.session){busy(el,false,'Criar conta');toast('Conta criada. Confirma o email e entra.');S.tab='login';render();return}
enter(r.data.user).then(function(){toast('Conta criada')})})}}
else if(a==='login'){var ok2=true;
if(!/^\S+@\S+\.\S+$/.test(val('email')))ok2=err('email','Escreve o teu email.');
if(val('pw').length<6)ok2=err('pw','A palavra-passe precisa de 6 caracteres ou mais.');
if(ok2){busy(el,true,'A entrar...');sb.auth.signInWithPassword({email:val('email'),password:val('pw')}).then(function(r){
if(r.error){busy(el,false,'Entrar');err('pw',msgErr(r.error));return}enter(r.data.user)})}}
else if(a==='logout'){sb.auth.signOut().then(function(){S.user=null;S.prof=null;S.scr='auth';render()})}
else if(a==='menu'){S.open=!S.open;render()}
else if(a==='mode'){var nm=v;S.open=false;sb.from('profiles').update({modo:nm.toLowerCase()}).eq('id',S.user.id).then(function(r){if(r.error){toast('Não foi possível mudar o modo.');return}S.mode=nm;if(nm==='Comprador'&&(S.scr==='mine'||S.scr==='publish'))S.scr='home';render();toast('Modo: '+nm)})}
else if(a==='nav'){if(v==='search'){go('home');setTimeout(function(){var q=$('q');if(q)q.focus()},50)}else if(v==='admin'){loadAdmin().then(function(){go('admin')})}else go(v)}
else if(a==='home'){go('home')}
else if(a==='cat'){S.cat=v;render()}
else if(a==='ad'){S.ad=+v;var b=$('ban');if(b)b.innerHTML=banner()}
else if(a==='prod'){S.pid=v;go('prod')}
else if(a==='apagar'){if(!confirm('Apagar este produto?'))return;sb.from('products').delete().eq('id',v).then(function(r){if(r.error){toast('Não foi possível apagar.');return}Promise.all([loadMine(),loadProds()]).then(render)})}
else if(a==='estado'){var pe=v.split('|');sb.rpc('admin_set_estado',{p_id:pe[0],p_estado:pe[1]}).then(function(r){if(r.error){toast('Não foi possível alterar.');return}Promise.all([loadAdmin(),loadProds()]).then(function(){render();toast(pe[1]==='aprovado'?'Produto aprovado':'Produto rejeitado')})})}
else if(a==='bativo'){var ba=v.split('|');sb.from('banners').update({ativo:ba[1]==='1'}).eq('id',ba[0]).then(function(r){if(r.error){toast('Não foi possível alterar.');return}Promise.all([loadAdmin(),loadBan()]).then(render)})}
else if(a==='bapagar'){if(!confirm('Apagar este banner?'))return;sb.from('banners').delete().eq('id',v).then(function(r){if(r.error){toast('Não foi possível apagar.');return}Promise.all([loadAdmin(),loadBan()]).then(render)})}
else if(a==='addban'){saveB();var bt=S.bf.bt,bp=S.bf.bp;
if(!S.bimg&&!bp){err('bp','Escolhe uma imagem ou um produto.');return}
busy(el,true,'A enviar...');var path=S.user.id+'/banner-'+Date.now()+'.jpg',mx=S.abn.reduce(function(m,b){return Math.max(m,b.ordem||0)},0)+1;
(S.bimg?sb.storage.from('produtos').upload(path,S.bimg.blob,{contentType:'image/jpeg'}).then(function(r){if(r.error)throw r.error;return sb.storage.from('produtos').getPublicUrl(path).data.publicUrl}):Promise.resolve(null))
.then(function(url){return sb.from('banners').insert({titulo:bt||(bp&&!url?'Em destaque':''),subtitulo:'',imagem_url:url,produto_id:bp||null,ordem:mx}).then(function(r){if(r.error)throw r.error})})
.then(function(){S.bimg=null;S.bf={};return Promise.all([loadAdmin(),loadBan()])}).then(function(){render();toast('Banner adicionado')})
.catch(function(){busy(el,false,'Adicionar banner');toast('Não foi possível adicionar o banner.')})}
else if(a==='publicar'){saveForm();var f=S.form,ok3=true,pr=parseInt(f.pp.replace(/\D/g,''),10);
if(S.photos.length<1)ok3=err('ph','Adiciona pelo menos uma foto.');
if(!f.pn)ok3=err('pn','Escreve o nome do produto.');
if(!pr||pr<=0)ok3=err('pp','Escreve um preço maior que zero.');
if(!f.pc)ok3=err('pc','Escolhe uma categoria.');
if(!f.pi)ok3=err('pi','Escolhe a cidade.');
if(ok3){busy(el,true,'A enviar fotos...');var ts=Date.now();
Promise.all(S.photos.map(function(ph,i){var path=S.user.id+'/'+ts+'-'+i+'.jpg';return sb.storage.from('produtos').upload(path,ph.blob,{contentType:'image/jpeg'}).then(function(r){if(r.error)throw r.error;return sb.storage.from('produtos').getPublicUrl(path).data.publicUrl})}))
.then(function(urls){return sb.from('products').insert({vendedor_id:S.user.id,nome:f.pn,preco_mt:pr,categoria:f.pc,cidade:f.pi,descricao:f.pd,imagens:urls}).then(function(r){if(r.error)throw r.error})})
.then(function(){S.photos=[];S.form={};return loadMine()}).then(function(){go('mine');toast('Enviado para análise')})
.catch(function(){busy(el,false,'Publicar produto');toast('Não foi possível publicar. Tenta de novo.')})}}}
app.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(t)act(t.getAttribute('data-a'),t.getAttribute('data-v'),t)});
app.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;$('grid').innerHTML=grid()}var er=$('e_'+e.target.id);if(er)er.textContent=''});
app.addEventListener('change',function(e){if(e.target.id==='file'&&e.target.files[0]){var fl=e.target.files[0];saveForm();compress(fl).then(function(b){S.photos.push({blob:b,url:URL.createObjectURL(b)});render()}).catch(function(){toast('Não foi possível usar esta foto.')})}});
app.addEventListener('change',function(e){if(e.target.id==='bfile'&&e.target.files[0]){saveB();compress(e.target.files[0],1200).then(function(b){S.bimg={blob:b,url:URL.createObjectURL(b)};render()}).catch(function(){toast('Não foi possível usar esta imagem.')})}});
setInterval(function(){var b=$('ban');if(b&&S.scr==='home'&&S.ban.length>1){S.ad=(S.ad+1)%S.ban.length;b.innerHTML=banner()}},3500);
// ===== ARRANQUE =====
Promise.race([sb.auth.getSession(),new Promise(function(ok){setTimeout(function(){ok({timeout:true})},6000)})]).then(function(r){if(r&&r.data&&r.data.session)enter(r.data.session.user);else render()}).catch(function(){render()});
</script>
</body>
</html>
